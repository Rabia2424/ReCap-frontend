<div class="content">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="title">Delete Car</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="carDeleteForm">
          <div class="form-group mb-3 hidden">
            <label for="id">Car Id</label>
            <input
              type="number"
              id="id"
              formControlName="carId"
              class="form-control"
            />
          </div>
          <div class="form-group mb-3">
            <label for="id">Brand Name</label>
            <input
              type="text"
              id="brand"
              formControlName="brandName"
              class="form-control"
            />
          </div>
          <div class="form-group mb-3">
            <label for="id">Color Name</label>
            <input
              type="text"
              id="color"
              formControlName="colorName"
              class="form-control"
            />
          </div>
          <div class="form-group mb-3">
            <label for="carName">Car Name</label>
            <input
              type="text"
              id="carName"
              formControlName="carName"
              class="form-control"
            />
          </div>
          <div class="form-group mb-3">
            <label for="modelYear">Model Year</label>
            <input
              type="number"
              id="modelYear"
              formControlName="modelYear"
              class="form-control"
            />
          </div>
          <div class="form-group mb-3">
            <label for="dailyPrice">Daily Price</label>
            <input
              type="number"
              id="dailyPrice"
              formControlName="dailyPrice"
              class="form-control"
            />
          </div>
          <div class="form-group mb-3">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              formControlName="description"
              class="form-control"
            />
          </div>
        </form>
      </div>
      <div class="card-footer">
        <button class="btn btn-fill btn-info" (click)="backToCarList()">
          Back To List
        </button>
        <button class="btn btn-fill btn-danger" (click)="delete()">
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
