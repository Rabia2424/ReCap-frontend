<div *ngIf="dataLoaded" class="container rounded mt-3 mb-5" style="color:white">
  <div class="row">
      <div class="col-md-3 border-right">
          <div  class="d-flex flex-column align-items-center text-center p-3 py-5"><img class="rounded-circle mt-5" width="150px" src="https://t3.ftcdn.net/jpg/03/46/83/96/240_F_346839683_6nAPzbhpSkIpb8pmAwufkC7c5eD7wYws.jpg">
              <span>{{user?.firstName}} {{user?.lastName}}</span>
              <span>{{user?.email}}</span><span></span></div>
      </div>
      <form [formGroup]="profileForm" class="col-md-9 border-right">
          <div class="p-3 py-0">
              <div class="d-flex justify-content-between align-items-center mb-3">
                  <h4 class="text-right">Profile Settings</h4>
              </div>
              <div class="row mt-2">
                  <div class="col-md-6"><label class="labels">First Name</label>
                      <input formControlName="firstName" type="text" class="form-control text-black" value=""></div>
                  <div class="col-md-6"><label class="labels">Last Name</label>
                      <input formControlName="lastName" type="text" class="form-control text-black" value=""></div>
                  <div class="col-md-6"><label class="labels">Email</label>
                      <input formControlName="email" type="text" class="form-control text-black" value=""></div>
              </div>
              <div class="mt-4 mb-4 text-center w-100"><button (click)="updateUserNames()" style="background-color: rgb(30, 143, 24);" class="w-100 btn btn-success profile-button" type="button">Update Informations</button></div>

              <form [formGroup]="passwordForm">
                  <div class="row mt-2">
                      <div class="col-md-6"><label class="labels">Old Password</label>
                          <input formControlName="oldPassword" type="password" class="form-control text-black" value=""></div>
                      <div class="col-md-6"><label class="labels">New Password</label>
                          <input formControlName="newPassword" type="password" class="form-control text-black" value=""></div>
                      <div class="mt-3 col-md-6">
                          <label class="labels">Repeat New Password</label>
                          <input formControlName="repeatNewPassword" type="password" class="form-control text-black" value="" >
                      </div>
                  </div>
                  <div class="mt-4 mb-4 text-center w-100"><button (click)="updatePassword()" style="background-color: rgb(30, 143, 24);color:white"   class="w-100 btn profile-button">Update Password</button></div>
              </form>
          </div>
      </form>
  </div>
</div>
